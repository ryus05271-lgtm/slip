version: 2.1

executors:
  android-builder:
    docker:
      - image: cimg/android:2024.01-node
    resource_class: medium

jobs:
  build-debug-apk:
    executor: android-builder
    steps:
      # 1. Checkout kode dari GitHub
      - checkout

      # 2. Beri izin eksekusi pada Gradle Wrapper
      - run:
          name: Chmod gradlew
          command: chmod +x ./gradlew

      # 3. Jalankan build APK Debug
      - run:
          name: Build Debug APK
          command: ./gradlew assembleDebug

      # 4. Simpan file APK sebagai Artifacts agar bisa diunduh
      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: app-debug.apk

workflows:
  build-pipeline:
    jobs:
      - build-debug-apk
