version: 2.1

executors:
  android-builder:
    docker:
      - image: cimg/android:2024.01-node
    resource_class: medium

jobs:
  build-debug-apk:
    executor: android-builder
    steps:
      - checkout

      # Menggunakan gradle bawaan sistem (tanpa butuh gradlew)
      - run:
          name: Build Debug APK
          command: gradle assembleDebug

      - store_artifacts:
          path: app/build/outputs/apk/debug/app-debug.apk
          destination: app-debug.apk

workflows:
  build-pipeline:
    jobs:
      - build-debug-apk
